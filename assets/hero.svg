<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="240" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080e" />
      <stop offset="50%" stop-color="#0a0d16" />
      <stop offset="100%" stop-color="#0e1322" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.6" />
    </linearGradient>

    <!-- Text Shimmer Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#f3f4f6" />
      <stop offset="70%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Cyber Grid Pattern -->
    <pattern id="cyberGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1f293d" stroke-width="0.7" stroke-opacity="0.45" />
      <circle cx="24" cy="24" r="0.8" fill="#00f2fe" fill-opacity="0.3" />
    </pattern>

    <!-- Radar Sweep Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.85); }
    }
    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes radarSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes circuitPulse {
      0%, 100% { stroke-dashoffset: 0; opacity: 0.4; }
      50% { stroke-dashoffset: 40; opacity: 0.85; }
    }
    .status-dot {
      animation: pulseDot 2s ease-in-out infinite;
      transform-origin: 52px 42px;
    }
    .cursor-blink {
      animation: blinkCursor 1s steps(1) infinite;
    }
    .radar-circle {
      transform-origin: 730px 120px;
      animation: radarSpin 16s linear infinite;
    }
    .circuit-line {
      stroke-dasharray: 8 4;
      animation: circuitPulse 6s ease-in-out infinite;
    }
    .font-mono {
      font-family: 'SF Mono', 'Fira Code', 'Consolas', 'JetBrains Mono', monospace;
    }
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif;
    }
  </style>

  <!-- Base Canvas & Frame -->
  <rect width="850" height="240" rx="16" fill="url(#bgGrad)" />
  <rect width="850" height="240" rx="16" fill="url(#cyberGrid)" />
  <rect x="0.5" y="0.5" width="849" height="239" rx="15.5" stroke="url(#borderGrad)" stroke-width="1.2" fill="none" opacity="0.65" />

  <!-- Corner Brackets -->
  <path d="M 16 32 L 16 16 L 32 16" stroke="#00f2fe" stroke-width="2" fill="none" opacity="0.8" />
  <path d="M 834 32 L 834 16 L 818 16" stroke="#00f2fe" stroke-width="2" fill="none" opacity="0.8" />
  <path d="M 16 208 L 16 224 L 32 224" stroke="#8b5cf6" stroke-width="2" fill="none" opacity="0.8" />
  <path d="M 834 208 L 834 224 L 818 224" stroke="#10b981" stroke-width="2" fill="none" opacity="0.8" />

  <!-- Status Pill Badge -->
  <g transform="translate(36, 30)">
    <rect width="270" height="26" rx="13" fill="#0d1424" stroke="#00f2fe" stroke-width="0.8" stroke-opacity="0.4" />
    <circle cx="16" cy="13" r="4.5" fill="#10b981" class="status-dot" filter="url(#subtleGlow)" />
    <text x="30" y="17" fill="#00f2fe" font-size="11" font-weight="700" letter-spacing="1.2" class="font-mono">
      AI_SECURITY // RESEARCH_ACTIVE
    </text>
  </g>

  <!-- Left Main Content -->
  <g transform="translate(36, 85)">
    <!-- Main Headline: Name -->
    <text x="0" y="38" fill="url(#titleGrad)" font-size="44" font-weight="900" letter-spacing="-0.8" class="font-sans">
      Hala Naaz
    </text>

    <!-- Positioning Statement -->
    <text x="2" y="70" fill="#94a3b8" font-size="15" font-weight="600" letter-spacing="0.4" class="font-sans">
      <tspan fill="#38bdf8">AI Security</tspan>
      <tspan fill="#64748b"> &nbsp;•&nbsp; </tspan>
      <tspan fill="#a78bfa">AI Red Teaming</tspan>
      <tspan fill="#64748b"> &nbsp;•&nbsp; </tspan>
      <tspan fill="#34d399">Security Research</tspan>
    </text>

    <!-- Terminal Command Line -->
    <g transform="translate(2, 94)">
      <rect x="0" y="0" width="460" height="28" rx="6" fill="#050811" stroke="#1e293b" stroke-width="0.8" />
      <text x="12" y="18" fill="#64748b" font-size="11.5" font-weight="600" class="font-mono">
        root@ashlynx:~$
      </text>
      <text x="122" y="18" fill="#38bdf8" font-size="11.5" font-weight="500" class="font-mono">
        verify-agent-intent --mode adversarial
      </text>
      <text x="408" y="18" fill="#10b981" font-size="12" font-weight="700" class="font-mono cursor-blink">
        _
      </text>
    </g>
  </g>

  <!-- Right Decorative Cyber Shield / Concentric Radar Node -->
  <g transform="translate(720, 120)">
    <!-- Ambient Glow behind Shield -->
    <circle cx="0" cy="0" r="65" fill="#8b5cf6" fill-opacity="0.08" filter="url(#neonGlow)" />
    
    <!-- Outer Rings -->
    <circle cx="0" cy="0" r="75" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 6" fill="none" opacity="0.6" />
    <circle cx="0" cy="0" r="58" stroke="#00f2fe" stroke-width="1.2" stroke-dasharray="14 8" fill="none" opacity="0.5" class="radar-circle" />
    <circle cx="0" cy="0" r="42" stroke="#8b5cf6" stroke-width="0.8" fill="none" opacity="0.4" />

    <!-- Shield Geometric Silhouette -->
    <path d="M 0 -28 L 24 -14 L 24 10 C 24 24 0 34 0 34 C 0 34 -24 24 -24 10 L -24 -14 Z" 
          fill="#0c1220" stroke="#00f2fe" stroke-width="1.6" filter="url(#subtleGlow)" />

    <!-- Inner Keyhole / Circuit Core inside Shield -->
    <circle cx="0" cy="-4" r="5" fill="#10b981" />
    <path d="M -3 -1 L 3 -1 L 4 14 L -4 14 Z" fill="#10b981" opacity="0.9" />

    <!-- Surrounding Target Reticle Ticks -->
    <line x1="-85" y1="0" x2="-75" y2="0" stroke="#00f2fe" stroke-width="1.5" opacity="0.6" />
    <line x1="75" y1="0" x2="85" y2="0" stroke="#00f2fe" stroke-width="1.5" opacity="0.6" />
    <line x1="0" y1="-85" x2="0" y2="-75" stroke="#00f2fe" stroke-width="1.5" opacity="0.6" />
    <line x1="0" y1="75" x2="0" y2="85" stroke="#00f2fe" stroke-width="1.5" opacity="0.6" />
  </g>
</svg>
